program: run_mlm.py
project: pt-scaling-hypers
method: bayes
metric:
  name: eval/loss
  goal: minimize

command:
  - ${env}
  - python
  - ${program}
  - --tokenizer_name
  - TinyLlama/TinyLlama-1.1B-intermediate-step-955k-token-2T
  - --config_name
  - configs/pt_base.json
  - --dataset_name
  - wikitext
  - --dataset_config_name
  - wikitext-103-raw-v1
  - --do_train
  - --do_eval
  - --save_total_limit
  - "1"
  - --logging_steps
  - "50"
  - --save_strategy
  - steps
  - --save_steps
  - "750"
  - --evaluation_strategy
  - steps
  - --eval_steps
  - "750"
  - --load_best_model_at_end
  - --metric_for_best_model
  - eval_loss
  - --lr_scheduler_type
  - cosine
  - --warmup_ratio
  - "0.05"
  - --report_to
  - wandb
  - --overwrite_output_dir
  - --output_dir
  - outputs/pt-sweep-run

parameters:

  # 目标参数量（27M）
  total_params_target:
    value: 80000000
  
  # 架构维度
  dim_ratio:  # dim_g / dim_z, auto-resolve num_channels/dim_z/dim_g in run_mlm.py
    values: [5.5]
    # 去掉global

  # 缩放因子 (幂律关系)
  binary_factor_scaling:
    values: [0.5]
  ternary_scaling_exp:  # ternary_factor_scaling = 1 / dim_z^exp
    values: [0.385]
    #min: 0.3
    #max: 0.5
    #distribution: uniform
  classifier_exp:  # classifier_amplifier = dim_z^exp
    values: [0.45]
    #min: 0.4
    #max: 1.2
    #distribution: uniform

  # 正则化强度 (第一阶段固定值)
  regularize_z:
    values: [0.01]
  regularize_g:
    values: [0.01]
  regularize_h:
    values: [0.0002]

  # 学习率计算参数 (lr = lr_eta0 / dim_z^lr_exp)
  lr_eta0:
    #min: 0.001
    #max: 0.1
    #distribution: log_uniform_values
    values: [0.01]
  lr_exp:
    min: 0
    max: 0.75
    distribution: uniform

  # Dropout (设为0)
  dropout_prob_z:
    values: [0]
  dropout_prob_h:
    values: [0]

  # 势函数
  potential_func_z:
    values: ["square"]
  potential_func_g:
    values: ["abs"]

  # 其他
  num_iterations:
    values: [12]
  ternary_rank:
    values: [64]
  max_position_embeddings:
    values: [1024]
  initializer_range:
    values: [0.02]
  binary_initializer_range:
    values: [0.2]
  ternary_initializer_range:
    values: [0.2]
  potential_eps:
    values: [1e-6]
  tie_word_embeddings:
    values: [false]
  rope_theta:
    values: [10000.0]
  hidden_act:
    values: ["silu"]
  layer_norm_eps:
    values: [1e-05]
  output_heads:
    values: [false]
  output_qzs:
    values: [false]
  
  # 训练超参数
  per_device_train_batch_size:
    values: [4]
  per_device_eval_batch_size:
    values: [4]
  gradient_accumulation_steps:
    values: [1]
  num_train_epochs:
    values: [0.3]

early_terminate:
  type: hyperband
  min_iter: 5

  # H node
  # transformer
  # large scale
  # 趋势