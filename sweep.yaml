program: run_mlm.py
project: pt-scaling-mup
method: bayes
metric:
  name: eval/loss
  goal: minimize

command:
  - ${env}
  - python
  - ${program}
  - --tokenizer_name
  - TinyLlama/TinyLlama-1.1B-intermediate-step-955k-token-2T
  - --config_name
  - configs/pt_base.json
  - --dataset_name
  - wikitext
  - --dataset_config_name
  - wikitext-103-raw-v1
  - --do_train
  - --do_eval
  - --save_total_limit
  - "1"
  - --logging_steps
  - "50"
  - --save_strategy
  - steps
  - --save_steps
  - "750"
  - --evaluation_strategy
  - steps
  - --eval_steps
  - "750"
  - --load_best_model_at_end
  - --metric_for_best_model
  - eval_loss
  - --lr_scheduler_type
  - cosine
  - --warmup_ratio
  - "0.05"
  - --report_to
  - wandb
  - --overwrite_output_dir
  - --output_dir
  - outputs/pt-sweep-run

parameters:

  # 架构维度 - Fixed dim_z for muP sweep (128)
  dim_z:
    value: 256
  
  dim_ratio:  # dim_g = dim_z * dim_ratio
    values: [5]

  ternary_rank_ratio: # ternary_rank = dim_z * (value)
    values: [0.2] # 调整倍数

  # 缩放因子 (Scalars - Constant in muP)
  binary_factor_scaling:
    distribution: log_uniform_values
    min: 0.1
    max: 30
  ternary_factor_scaling:
    distribution: log_uniform_values
    min: 0.1
    max: 1
  classifier_amplifier:
    distribution: log_uniform_values
    min: 100
    max: 2000

  # 正则化强度 (Invariant)
  regularize_z:
    distribution: log_uniform_values
    min: 0.1
    max: 5
  regularize_g:
    distribution: log_uniform_values
    min: 0.2
    max: 5
  regularize_h:
    distribution: log_uniform_values
    min: 0.02
    max: 1.25

  # 学习率 (Base LR)
  learning_rate:
    distribution: log_uniform_values
    min: 0.02
    max: 0.08

  # Dropout (设为0)
  dropout_prob_z:
    values: [0]
  dropout_prob_h:
    values: [0]

  # 势函数
  potential_func_z:
    values: ["square"]
  potential_func_g:
    values: ["abs"]

  # 其他
  num_iterations:
    values: [8]
  # ternary_rank: computed from ratio
  max_position_embeddings:
    values: [1024]
  initializer_range:
    values: [0.02] # For Input weights (others overwritten)
  binary_initializer_range:
    values: [0.2] # Overwritten by muP logic to 1/sqrt(d)
  ternary_initializer_range:
    values: [0.2] # Overwritten by muP logic to 1/sqrt(d)
  potential_eps:
    values: [0.02]
  binary_initializer_range:
    values: [0.2]
  ternary_initializer_range:
    values: [0.2]
  potential_eps:
    values: [1e-6]
  tie_word_embeddings:
    values: [false]
  rope_theta:
    values: [10000.0]
  hidden_act:
    values: ["silu"]
  layer_norm_eps:
    values: [1e-05]
  output_heads:
    values: [false]
  output_qzs:
    values: [false]
  
  # 训练超参数
  per_device_train_batch_size:
    values: [4]
  per_device_eval_batch_size:
    values: [4]
  gradient_accumulation_steps:
    values: [1]
  num_train_epochs:
    values: [0.3]

early_terminate:
  type: hyperband
  min_iter: 3

  # H node
  # transformer
  # large scale
  # 趋势